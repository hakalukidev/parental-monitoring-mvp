name: Seftly verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build && npm run lint && npm test && npm audit --audit-level=high
        working-directory: backend
      - run: python3 scripts/check_security.py
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get && dart format --output=none --set-exit-if-changed lib test && flutter analyze && flutter test
        working-directory: parent-app
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug
        working-directory: child-app
# Production signing and deployment are intentionally outside PR jobs.
# Use an environment-protected release job with private signing/host credentials.
